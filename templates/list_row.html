<li data-id="{{ doc.id }}"><a href="/doc/{{ doc.id }}"><span class="doc-id">{{ doc.id }}</span> <span class="doc-title">{{ doc.title }}</span></a> {% if !doc.tags.is_empty() %}<span class="doc-tags">{% for t in doc.tags %}<a class="tag tag--h{{ t.hue }}" href="/?tag={{ t.name }}">{{ t.name }}</a>{% if !loop.last %} {% endif %}{% endfor %}</span>{% endif %} <span class="doc-status" data-status="{{ doc.status }}"><span class="status-swatch"></span>{{ doc.status }}</span></li>
