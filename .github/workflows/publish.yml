name: Publish

on:
  push:
    branches: [main]

permissions: {}

jobs:
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write # OIDC for crates.io Trusted Publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Put flake's Rust toolchain on PATH
        # nix develop --command spawns a subshell whose PATH doesn't survive
        # to the next step, and release-plz/action is a separate step, so we
        # persist the devShell's cargo dir to $GITHUB_PATH instead.
        #
        # $CARGO pins release-plz and cargo-semver-checks to the flake's cargo:
        # release-plz's cargo-binstall self-install prepends ~/.cargo/bin, whose
        # rustup shim would otherwise shadow ours and auto-install a broken stable.
        # tail -n1: the devShell shellHook prints to stdout before the path.
        run: |
          cargo_bin="$(nix develop --command sh -c 'command -v cargo' | tail -n1)"
          echo "$(dirname "$cargo_bin")" >> "$GITHUB_PATH"
          echo "CARGO=$cargo_bin" >> "$GITHUB_ENV"
      - name: Repair rustup stable for cargo-semver-checks
        # cargo-semver-checks ignores $CARGO and builds rustdoc via the runner's
        # rustup shim. The runner's pre-installed stable is partial, so the shim
        # auto-updates and dies on a clippy component conflict (E0463). Reinstall
        # stable to latest with a minimal profile (no clippy) so the shim finds a
        # complete toolchain and never re-syncs mid-build.
        run: rustup toolchain install stable --profile minimal --force
      - name: Run release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pr:
    name: Publish PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Put flake's Rust toolchain on PATH
        # nix develop --command spawns a subshell whose PATH doesn't survive
        # to the next step, and release-plz/action is a separate step, so we
        # persist the devShell's cargo dir to $GITHUB_PATH instead.
        #
        # $CARGO pins release-plz and cargo-semver-checks to the flake's cargo:
        # release-plz's cargo-binstall self-install prepends ~/.cargo/bin, whose
        # rustup shim would otherwise shadow ours and auto-install a broken stable.
        # tail -n1: the devShell shellHook prints to stdout before the path.
        run: |
          cargo_bin="$(nix develop --command sh -c 'command -v cargo' | tail -n1)"
          echo "$(dirname "$cargo_bin")" >> "$GITHUB_PATH"
          echo "CARGO=$cargo_bin" >> "$GITHUB_ENV"
      - name: Run release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
