[coordination]
remote = "origin"
lease_duration = "60m"
grace_period = "2m"
max_push_retries = 5

[[types]]
name = "convention"
plural = "convention"
dir = "docs/convention"
prefix = "CONVENTION"
icon = "📜"
singleton = true
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted", "in-progress", "complete", "rejected", "superseded"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }, { from = "review", to = "rejected" }, { from = "accepted", to = "in-progress" }, { from = "in-progress", to = "complete" }, { from = "*", to = "superseded" }] }

[[types]]
name = "dictum"
plural = "dicta"
dir = "docs/convention"
prefix = "DICTUM"
icon = "⚖"
parent_type = "convention"
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }] }

[[types]]
name = "spec"
plural = "specs"
dir = "docs/specs"
prefix = "SPEC"
icon = "📋"
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted", "in-progress", "complete", "rejected", "superseded"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }, { from = "review", to = "rejected" }, { from = "accepted", to = "in-progress" }, { from = "in-progress", to = "complete" }, { from = "*", to = "superseded" }] }

[[types]]
name = "rfc"
plural = "rfcs"
dir = "docs/rfcs"
prefix = "RFC"
icon = "●"
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted", "in-progress", "complete", "rejected", "superseded"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }, { from = "review", to = "rejected" }, { from = "accepted", to = "in-progress" }, { from = "in-progress", to = "complete" }, { from = "*", to = "superseded" }] }

[[types]]
name = "story"
plural = "stories"
dir = "docs/stories"
prefix = "STORY"
icon = "▲"
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted", "in-progress", "complete", "rejected", "superseded"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }, { from = "review", to = "rejected" }, { from = "accepted", to = "in-progress" }, { from = "in-progress", to = "complete" }, { from = "*", to = "superseded" }] }

[[types]]
name = "iteration"
plural = "iterations"
dir = "docs/iterations"
prefix = "ITERATION"
icon = "◆"
agents = ["build"]
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted", "in-progress", "complete", "rejected", "superseded"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }, { from = "review", to = "rejected" }, { from = "accepted", to = "in-progress" }, { from = "in-progress", to = "complete" }, { from = "*", to = "superseded" }] }

[[types]]
name = "adr"
plural = "adrs"
dir = "docs/adrs"
prefix = "ADR"
icon = "■"
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted", "in-progress", "complete", "rejected", "superseded"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }, { from = "review", to = "rejected" }, { from = "accepted", to = "in-progress" }, { from = "in-progress", to = "complete" }, { from = "*", to = "superseded" }] }

[[types]]
name = "audit"
plural = "audits"
dir = "docs/audits"
prefix = "AUDIT"
icon = "🔍"
authorship = "generated"
lifecycle = { states = ["draft", "review", "accepted", "in-progress", "complete", "rejected", "superseded"], edges = [{ from = "draft", to = "review" }, { from = "review", to = "accepted" }, { from = "review", to = "rejected" }, { from = "accepted", to = "in-progress" }, { from = "in-progress", to = "complete" }, { from = "*", to = "superseded" }] }

[[types]]
name = "bug"
plural = "bugs"
dir = "docs/bugs"
prefix = "BUG"
icon = "🐛"
intent = "Report an observed defect — expected vs actual with repro steps — and track it to resolution."
numbering = "incremental"
subdirectory = false
store = "filesystem"
singleton = false
agents = []
authorship = "assisted"
lifecycle = { states = ["reported", "triaged", "in-progress", "fixed", "wontfix"], edges = [{ from = "reported", to = "triaged" }, { from = "triaged", to = "in-progress" }, { from = "in-progress", to = "fixed" }, { from = "reported", to = "wontfix" }, { from = "triaged", to = "wontfix" }] }


[[types.attributes]]
name = "priority"
kind = "enum"
values = ["low", "medium", "high"]

[[types.attributes]]
name = "estimate"
kind = "int"

[[types.attributes]]
name = "due"
kind = "date"

[[types]]
name = "milestone"
plural = "milestones"
dir = "docs/milestones"
prefix = "MILESTONE"
icon = "🏁"
store = "github-milestones"
intent = "A GitHub milestone authored as structured markdown"

[[types]]
name = "clickup"
plural = "clickups"
dir = "docs/clickups"
prefix = "CLICKUP"
store = "clickup-tasks"
clickup_list_id = "901615772121"

[[relationships]]
name = "implements"
inverse = "implemented-by"
traversal = "chain"

[[relationships]]
name = "supersedes"
inverse = "superseded-by"

[[relationships]]
name = "blocks"
inverse = "blocked-by"
github_native = "dependency"

[[relationships]]
name = "related-to"
traversal = "related"

[[relationships]]
name = "targets"
inverse = "targeted-by"
github_native = "milestone"
traversal = "chain"

[[relationships]]
name = "member-of"
inverse = "has-member"
github_native = "membership"

[agents]
interactive = 'opencode run "$LAZYSPEC_PROMPT"'

[github]
repo = 'jkaloger/lazyspec'

[templates]
dir = ".lazyspec/templates"

[naming]
pattern = "{type}-{n:03}-{title}.md"

[tui.statusbar]
left = ["mode", "git_branch"]
right = ["version", "help_hint"]


[[rules]]
shape = "parent-child"
name = "stories-need-rfcs"
child = "story"
parent = "rfc"
severity = "warning"

[[rules]]
shape = "parent-child"
name = "iterations-need-stories"
child = "iteration"
parent = "story"
severity = "error"

[[rules]]
shape = "relation-existence"
name = "adrs-need-relations"
type = "adr"
require = "any-relation"
severity = "error"
