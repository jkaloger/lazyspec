[coordination]
remote = "origin"
lease_duration = "60m"
grace_period = "2m"
max_push_retries = 5

[[types]]
name = "convention"
plural = "convention"
dir = "docs/convention"
prefix = "CONVENTION"
icon = "📜"
singleton = true

[[types]]
name = "dictum"
plural = "dicta"
dir = "docs/convention"
prefix = "DICTUM"
icon = "⚖"
parent_type = "convention"

[[types]]
name = "spec"
plural = "specs"
dir = "docs/specs"
prefix = "SPEC"
icon = "📋"

[[types]]
name = "rfc"
plural = "rfcs"
dir = "docs/rfcs"
prefix = "RFC"
icon = "●"

[[types]]
name = "story"
plural = "stories"
dir = "docs/stories"
prefix = "STORY"
icon = "▲"

[[types]]
name = "iteration"
plural = "iterations"
dir = "docs/iterations"
prefix = "ITERATION"
icon = "◆"

[[types]]
name = "adr"
plural = "adrs"
dir = "docs/adrs"
prefix = "ADR"
icon = "■"

[[types]]
name = "audit"
plural = "audits"
dir = "docs/audits"
prefix = "AUDIT"
icon = "🔍"

[github]
repo = 'jkaloger/lazyspec'

[templates]
dir = ".lazyspec/templates"

[naming]
pattern = "{type}-{n:03}-{title}.md"

[tui.statusbar]
left = ["mode", "git_branch"]
right = ["version", "help_hint"]

# Priority vocabulary — defaults to MoSCoW when omitted.
# Uncomment to override; defining any [priorities.*] block replaces the
# defaults entirely (no merge with MoSCoW).
# [priorities.must]
# weight = 4
# [priorities.should]
# weight = 3
# [priorities.could]
# weight = 2
# [priorities.wont]
# weight = 1

# Per-type overrides for `requires_priority` and `terminal_statuses`.
# Both fall back to spec defaults (RFC-041) when omitted: story + iteration
# require a priority; terminal sets follow the document's lifecycle table.
# [[types]]
# name = "rfc"
# requires_priority = false
# terminal_statuses = ["complete", "superseded", "rejected"]

