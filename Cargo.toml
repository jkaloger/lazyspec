[package]
name = "lazyspec"
version = "0.12.2"
edition = "2021"
description = "A little TUI & CLI for project documentation."
license = "MIT"
repository = "https://github.com/jkaloger/lazyspec"
homepage = "https://github.com/jkaloger/lazyspec"
readme = "README.md"
default-run = "lazyspec"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_yaml = "0.9"
minijinja = "2"
tui-markdown = "0.3"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
regex = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
console = "0.15"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
crossbeam-channel = "0.5"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-width = "0.2"
sqids = "0.4"
pulldown-cmark = "0.13"
indicatif = "0.17"
textwrap = "0.16"
tempfile = "3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
keyring = { version = "4.1.4", features = ["apple-native-keyring-store"] }
dialoguer = "0.11"
nucleo = "0.5.0"
globset = "0.4"

[features]
default = []
metrics = []
test-support = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.nucleo]
opt-level = 3

[profile.dev.package.nucleo-matcher]
opt-level = 3

[profile.test]
debug = "line-tables-only"

[dev-dependencies]
lazyspec = { path = ".", features = ["test-support"] }
jsonschema = { version = "0.47", default-features = false }
strum = { version = "0.28", features = ["derive"] }

