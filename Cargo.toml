[package]
name = "lazyspec"
version = "0.9.1"
edition = "2021"
description = "A little TUI & CLI for project documentation."
license = "MIT"
repository = "https://github.com/jkaloger/lazyspec"
homepage = "https://github.com/jkaloger/lazyspec"
readme = "README.md"
default-run = "lazyspec"

[[bin]]
name = "lazyspec-app"
path = "src/bin/lazyspec-app.rs"
required-features = ["app"]

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_yaml = "0.9"
minijinja = "2"
tui-markdown = "0.3"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
regex = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
console = "0.15"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
crossbeam-channel = "0.5"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-width = "0.2"
sqids = "0.4"
pulldown-cmark = "0.13"
indicatif = "0.17"
textwrap = "0.16"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"], optional = true }
axum = { version = "0.8", optional = true }
askama = { version = "0.14", optional = true }
tauri = { version = "2.11.4", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
http = { version = "1", optional = true }
dirs = { version = "6", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
keyring = { version = "4.1.4", features = ["apple-native-keyring-store"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
default = []
agent = []
metrics = []
web = ["dep:tokio", "dep:axum", "dep:askama"]
app = ["web", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tower", "dep:http", "dep:tauri-build", "dep:dirs"]
test-support = []

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[dev-dependencies]
lazyspec = { path = ".", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
http = { version = "1" }
jsonschema = { version = "0.47", default-features = false }

