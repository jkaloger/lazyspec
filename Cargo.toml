[package]
name = "lazyspec"
version = "0.9.0"
edition = "2021"
description = "A little TUI & CLI for project documentation."
license = "MIT"
repository = "https://github.com/jkaloger/lazyspec"
homepage = "https://github.com/jkaloger/lazyspec"
readme = "README.md"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
minijinja = "2"
tui-markdown = "0.3"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
regex = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
console = "0.15"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
crossbeam-channel = "0.5"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-width = "0.2"
sqids = "0.4"
pulldown-cmark = "0.13"
indicatif = "0.17"
textwrap = "0.16"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"], optional = true }
axum = { version = "0.8", optional = true }
askama = { version = "0.14", optional = true }

[features]
default = []
agent = []
metrics = []
# Read-only web view (RFC-052). Gates the entire `src/web/` module and its async
# stack so default builds link no tokio/axum/askama and expose no `serve` command.
web = ["dep:tokio", "dep:axum", "dep:askama"]
# Exposes test-only fixtures (e.g. `Config::default()`) to the integration test
# crates, which compile against the non-test build of the library. The binary
# never enables this, so the production load path carries no default config.
test-support = []

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[dev-dependencies]
# Self-reference so integration tests link the library with test-only fixtures.
lazyspec = { path = ".", features = ["test-support"] }
# Web-view tests (gated `#[cfg(feature = "web")]`) drive the axum Router directly
# via `tower::ServiceExt::oneshot` to avoid real-network flakiness. Dev-only;
# never enters the library or binary build.
tower = { version = "0.5", features = ["util"] }

