[package]
name = "lazyspec"
version = "0.8.0"
edition = "2021"
description = "A little TUI & CLI for project documentation."
license = "MIT"
repository = "https://github.com/jkaloger/lazyspec"
homepage = "https://github.com/jkaloger/lazyspec"
readme = "README.md"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tui-markdown = "0.3"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
anyhow = "1"
regex = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
console = "0.15"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
crossbeam-channel = "0.5"
ratatui-image = { version = "10", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
unicode-width = "0.2"
sqids = "0.4"
pulldown-cmark = "0.13"
indicatif = "0.17"
textwrap = "0.16"
tempfile = "3"

[features]
default = []
agent = []
metrics = []

[dev-dependencies]
